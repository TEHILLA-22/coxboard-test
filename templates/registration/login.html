{% extends "base.html" %}
{% block content %}
<h1>Sign in to CoxBoard</h1>
<form method="post" class="panel form">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="button" type="submit">Login</button>
</form>
<p>New here? <a href="{% url 'signup' %}">Create account</a></p>
{% endblock %}
